[project]
name = "qms-backend"
version = "0.1.0"
description = "Construction Quality Management System — FastAPI backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    # Database — async stack
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.9",
    # Email
    "fastapi-mail==1.4.1",
    "jinja2==3.1.4",
    # Config & validation
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "email-validator==2.3.0",  # required by pydantic EmailStr
    # AI analyst agent (Phase 8)
    "langgraph>=0.1.5",
    "httpx==0.27.0",  # also drives the Ollama client at runtime
    # OCR / Intelligent Document Processing (Phase 10)
    "pdfplumber>=0.11.0",           # digital-PDF text + table extraction (zero OCR overhead)
    "pdf2image>=1.17.0",            # rasterise PDF pages for Tesseract (needs poppler system pkg)
    "pytesseract>=0.3.13",          # Tesseract OCR Python wrapper (needs tesseract system binary)
    "pillow>=10.0.0",               # image handling required by pdf2image / pytesseract
    "opencv-python-headless>=4.9.0.80",  # image enhancement: deskew, denoise, threshold
    "camelot-py[cv]>=0.11.0",       # complex lattice/stream table extraction from PDFs
    "pyyaml>=6.0.1",                # load per-doc-type YAML field-extraction templates
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Editable-install the app package so `app...` imports resolve everywhere
# (tests, alembic, uvicorn) without any PYTHONPATH juggling.
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length — handled by the formatter, not enforced hard
    "B008",   # Depends()/require_role() in defaults is the idiomatic FastAPI pattern
    "UP042",  # str-mixin Enums are intentional (SQLAlchemy/Pydantic value serialization)
]
